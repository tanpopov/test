<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instagram競合投稿分析 | 野菜アカウント用</title>
    <style>
      :root {
        --bg: #f4f7f3;
        --card: #ffffff;
        --text: #1f2a1f;
        --muted: #5d6b5d;
        --accent: #2f8f4e;
        --accent-light: #dff5e5;
        --border: #d7e2d7;
        --danger: #b43737;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .container {
        max-width: 1080px;
        margin: 0 auto;
        padding: 16px;
      }

      h1 {
        margin: 8px 0 18px;
        font-size: 1.4rem;
      }

      .grid {
        display: grid;
        gap: 16px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
        box-shadow: 0 1px 2px rgba(0,0,0,0.03);
      }

      .form-grid {
        display: grid;
        gap: 10px;
      }

      label { font-size: 0.9rem; font-weight: 600; }
      input, select, textarea, button {
        width: 100%;
        font: inherit;
        border-radius: 10px;
      }
      input, select, textarea {
        border: 1px solid var(--border);
        padding: 10px;
        background: #fff;
      }
      textarea { min-height: 74px; resize: vertical; }

      .two-col {
        display: grid;
        gap: 10px;
      }

      .actions {
        display: flex;
        gap: 10px;
      }

      button {
        border: 0;
        padding: 10px 12px;
        cursor: pointer;
      }

      .btn-primary {
        background: var(--accent);
        color: #fff;
        font-weight: 700;
      }

      .btn-secondary {
        background: var(--accent-light);
        color: var(--accent);
        font-weight: 700;
      }

      .filters {
        display: grid;
        gap: 10px;
      }

      .table-wrap { overflow-x: auto; }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 940px;
      }
      th, td {
        border-bottom: 1px solid var(--border);
        text-align: left;
        padding: 10px 8px;
        vertical-align: top;
        font-size: 0.9rem;
      }
      th { color: var(--muted); font-weight: 700; background: #fbfdfb; }
      .small { color: var(--muted); font-size: 0.82rem; }
      .delete {
        background: #ffe8e8;
        color: var(--danger);
        padding: 6px 8px;
        border-radius: 8px;
        border: 0;
      }

      @media (min-width: 760px) {
        .two-col { grid-template-columns: 1fr 1fr; }
        .filters { grid-template-columns: 1fr 1fr 1fr; }
      }

      @media (max-width: 759px) {
        h1 { font-size: 1.2rem; }
        .container { padding: 10px; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Instagram競合投稿分析（野菜アカウント向け）</h1>

      <section class="card">
        <h2>投稿データ登録</h2>
        <p class="small">競合投稿を1件ずつ記録し、一覧と絞り込みで傾向を確認できます。</p>

        <form id="postForm" class="form-grid">
          <div class="two-col">
            <div>
              <label for="url">競合投稿URL *</label>
              <input id="url" required type="url" placeholder="https://www.instagram.com/reel/..." />
            </div>
            <div>
              <label for="accountName">アカウント名 *</label>
              <input id="accountName" required placeholder="例: veggie_kitchen_jp" />
            </div>
          </div>

          <div class="two-col">
            <div>
              <label for="theme">投稿テーマ *</label>
              <input id="theme" required placeholder="例: キャベツが甘くなる炒め方" />
            </div>
            <div>
              <label for="vegetable">野菜名 *</label>
              <input id="vegetable" required placeholder="例: にんじん" />
            </div>
          </div>

          <div class="two-col">
            <div>
              <label for="views">再生数</label>
              <input id="views" type="number" min="0" placeholder="0" />
            </div>
            <div>
              <label for="likes">いいね数</label>
              <input id="likes" type="number" min="0" placeholder="0" />
            </div>
          </div>

          <div class="two-col">
            <div>
              <label for="comments">コメント数</label>
              <input id="comments" type="number" min="0" placeholder="0" />
            </div>
            <div>
              <label for="postType">投稿の型 *</label>
              <select id="postType" required>
                <option value="">選択してください</option>
                <option>失敗指摘</option>
                <option>意外な正解</option>
                <option>保存方法</option>
                <option>時短レシピ</option>
                <option>比較</option>
                <option>豆知識</option>
              </select>
            </div>
          </div>

          <div>
            <label for="hook">1枚目のフック文 *</label>
            <textarea id="hook" required placeholder="例: その切り方、栄養を半分捨てています"></textarea>
          </div>

          <div>
            <label for="whyViral">なぜ伸びたと思うか（メモ）</label>
            <textarea id="whyViral" placeholder="例: 意外性 + すぐ試せる + 数字で根拠"></textarea>
          </div>

          <div>
            <label for="myIdea">自分用の似た投稿案</label>
            <textarea id="myIdea" placeholder="例: ほうれん草版に置き換え、3ステップで実演"></textarea>
          </div>

          <div class="two-col">
            <div>
              <label for="myHook1">自分用1枚目フック案①</label>
              <input id="myHook1" placeholder="例: 9割が知らない○○" />
            </div>
            <div>
              <label for="myHook2">自分用1枚目フック案②</label>
              <input id="myHook2" placeholder="例: その保存、逆効果です" />
            </div>
          </div>

          <div>
            <label for="myHook3">自分用1枚目フック案③</label>
            <input id="myHook3" placeholder="例: 今すぐやめて。野菜がまずくなる理由" />
          </div>

          <div>
            <label for="imagePrompt">画像生成プロンプト</label>
            <textarea id="imagePrompt" placeholder="例: 明るいキッチン、木のまな板、にんじんの断面アップ..." ></textarea>
          </div>

          <div class="actions">
            <button type="submit" class="btn-primary">保存する</button>
            <button id="clearBtn" type="button" class="btn-secondary">入力をクリア</button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>絞り込み・並び替え</h2>
        <div class="filters">
          <div>
            <label for="filterVegetable">野菜名で絞り込み</label>
            <input id="filterVegetable" placeholder="例: にんじん" />
          </div>
          <div>
            <label for="filterPostType">投稿の型で絞り込み</label>
            <select id="filterPostType">
              <option value="">すべて</option>
              <option>失敗指摘</option>
              <option>意外な正解</option>
              <option>保存方法</option>
              <option>時短レシピ</option>
              <option>比較</option>
              <option>豆知識</option>
            </select>
          </div>
          <div>
            <label for="sortViews">再生数順</label>
            <select id="sortViews">
              <option value="desc">高い順</option>
              <option value="asc">低い順</option>
            </select>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>投稿一覧</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>URL / アカウント</th>
                <th>テーマ / 野菜 / 型</th>
                <th>数値</th>
                <th>フック / 分析</th>
                <th>自分案</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
